name: advanced-orca-workspace

services:
  postgres:
    image: postgres:17.2-alpine3.20
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./state/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - persistence
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
    networks:
      - transport
    healthcheck:
      test: ["CMD-SHELL", "/opt/guacamole/sbin/guacd -v >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 8
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_healthy
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: ${POSTGRES_DB:?set in .env}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:?set in .env}
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASSWORD:?set in .env}
      TOTP_ENABLED: "true"
      TOTP_ISSUER: ${TOTP_ISSUER:-EvoFab Advanced Orca Workspace}
      USER_MAX_CONNECTIONS: "1"
      USER_MAX_CONNECTIONS_PER_CONNECTION: "1"
      API_SESSION_TIMEOUT: "60"
      WEBAPP_CONTEXT: ROOT
    ports:
      - "127.0.0.1:${GUACAMOLE_HTTP_PORT:-8085}:8080"
    networks:
      - persistence
      - transport
    healthcheck:
      test: ["CMD-SHELL", "test -f /opt/guacamole/webapp/guacamole.war"]
      interval: 15s
      timeout: 5s
      retries: 8
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1536M

networks:
  persistence:
    internal: true
  transport:
    internal: true

volumes:
  postgres-data:
    name: advanced-orca-workspace-postgres-data
